---
- name: Device Specific Provisioning
  hosts: localhost
  connection: local
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    # ==========================================================================
    # Common Applications
    # ==========================================================================
    - name: Common - Install basic system utilities & guest agent
      apt:
        name:
          - htop
          - fastfetch
          - tree
          - vim
          - qemu-guest-agent
        state: present
        update_cache: yes

    # ==========================================================================
    # Desktop Customizations (zatestvmtest01)
    # ==========================================================================
    - name: Desktop Specific Tasks
      when: ansible_hostname == "zatestvmtest01"
      block:
        - name: Desktop Specific - Install KDE Plasma Desktop, SDDM & System Monitor
          apt:
            name:
              - kde-plasma-desktop
              - plasma-systemmonitor
              - sddm
              - libxcb-cursor0
              - apt-transport-https
              - curl
              - gnupg
            state: present

        - name: Desktop Specific - Purge Firefox ESR
          apt:
            name:
              - firefox-esr
              - "firefox-esr-l10n-*"
            state: absent
            purge: yes

        # --- Brave Nightly Installation ---
        - name: Brave Nightly - Download repository GPG keyring
          get_url:
            url: https://brave-browser-apt-nightly.s3.brave.com/brave-browser-nightly-archive-keyring.gpg
            dest: /usr/share/keyrings/brave-browser-nightly-archive-keyring.gpg
            mode: '0644'

        - name: Brave Nightly - Download DEB822 repository definition
          get_url:
            url: https://brave-browser-apt-nightly.s3.brave.com/brave-browser.sources
            dest: /etc/apt/sources.list.d/brave-browser-nightly.sources
            mode: '0644'

        - name: Brave Nightly - Remove legacy list file if present
          file:
            path: /etc/apt/sources.list.d/brave-browser-nightly.list
            state: absent

        - name: Brave Nightly - Install package
          apt:
            name: brave-browser-nightly
            state: present
            update_cache: yes

        # --- /etc/skel Pre-seeding for New Users ---
        - name: Desktop Specific - Ensure /etc/skel/.config directory exists
          file:
            path: /etc/skel/.config
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Desktop Specific - Pre-seed plasma-org.kde.plasma.desktop-appletsrc in /etc/skel
          copy:
            dest: /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
            owner: root
            group: root
            mode: '0644'
            content: |
              [Containments][2]
              activityId=
              formfactor=2
              immutability=1
              lastScreen=0
              location=4
              plugin=org.kde.panel
              wallpaperplugin=org.kde.image

              [Containments][2][Applets][3]
              immutability=1
              plugin=org.kde.plasma.kickoff

              [Containments][2][Applets][3][Configuration][General]
              favorites=applications:org.kde.plasma-systemmonitor.desktop,applications:systemsettings.desktop,applications:org.kde.discover.desktop,applications:org.kde.dolphin.desktop,applications:com.brave.Browser.nightly.desktop
              favoritesPortedToKAstats=false
              systemFavorites=suspend,hibernate,reboot,shutdown

              [Containments][2][Applets][5]
              immutability=1
              plugin=org.kde.plasma.icontasks

              [Containments][2][Applets][5][Configuration][General]
              launchers=applications:systemsettings.desktop,applications:com.brave.Browser.nightly.desktop,applications:org.kde.dolphin.desktop,applications:org.kde.konsole.desktop

              [Containments][2][General]
              AppletOrder=3;4;5;6;7;19;20

        # --- KDE Plasma 6 Customizations ---
        - name: KDE Customization - Ensure user directories exist
          file:
            path: "{{ item }}"
            state: directory
            owner: ratel
            group: ratel
            mode: '0755'
          loop:
            - /home/ratel/.config
            - /home/ratel/.local/bin
            - /home/ratel/.local/share/konsole
            - /home/ratel/.local/state
            - /home/ratel/.local/share/dolphin/view_properties/global

        - name: Desktop Specific - Seed desktop appletsrc directly to ratel home
          copy:
            src: /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
            dest: /home/ratel/.config/plasma-org.kde.plasma.desktop-appletsrc
            owner: ratel
            group: ratel
            mode: '0644'
            remote_src: true

        - name: KDE Customization - Create Dracula Konsole color scheme
          copy:
            dest: /home/ratel/.local/share/konsole/Dracula.colorscheme
            owner: ratel
            group: ratel
            mode: '0644'
            content: |
              [Background]
              Color=40,42,54
              [Foreground]
              Color=248,248,242
              [General]
              Description=Dracula
              Opacity=0.85
              [Color0]
              Color=189,147,249
              [Color1]
              Color=255,85,85
              [Color2]
              Color=80,250,123
              [Color3]
              Color=255,121,198
              [Color4]
              Color=139,233,253
              [Color5]
              Color=241,250,140
              [Color6]
              Color=98,114,164
              [Color7]
              Color=68,71,90

        - name: KDE Customization - Create Ratel Konsole profile
          copy:
            dest: /home/ratel/.local/share/konsole/Ratel.profile
            owner: ratel
            group: ratel
            mode: '0644'
            content: |
              [Appearance]
              ColorScheme=Dracula

              [General]
              Name=Ratel
              Parent=FALLBACK/

        - name: KDE Customization - Desktop Theme Script
          copy:
            dest: /home/ratel/.local/bin/apply-kde-theme.sh
            owner: ratel
            group: ratel
            mode: '0755'
            content: |
              #!/bin/bash
              export QT_QPA_PLATFORM=offscreen

              # 1. Stop processes to release locks on config files and databases
              killall -9 plasmashell kactivitymanagerd 2>/dev/null

              # 2. Clear KActivity Stats database cache
              rm -rf "$HOME/.local/share/kactivitymanagerd/resources/"*

              # 3. Global Plasma Theme & Colour Palette
              plasma-apply-lookandfeel -a org.kde.breezedark.desktop 2>/dev/null
              plasma-apply-colorscheme BreezeDark 2>/dev/null

              # 4. Kdeglobals Custom Dark Palette
              kwriteconfig6 --file kdeglobals --group "Colors:View" --key "BackgroundNormal" "20,22,24"
              kwriteconfig6 --file kdeglobals --group "Colors:View" --key "ForegroundNormal" "252,252,252"
              kwriteconfig6 --file kdeglobals --group "Colors:Window" --key "BackgroundNormal" "32,35,38"
              kwriteconfig6 --file kdeglobals --group "Colors:Window" --key "ForegroundNormal" "252,252,252"
              kwriteconfig6 --file kdeglobals --group "Colors:Selection" --key "BackgroundNormal" "61,174,233"
              kwriteconfig6 --file kdeglobals --group "Colors:Selection" --key "ForegroundNormal" "252,252,252"

              # 5. File Dialog & Previews (kdeglobals)
              kwriteconfig6 --file kdeglobals --group "KFileDialog Settings" --key "Show hidden files" true
              kwriteconfig6 --file kdeglobals --group "KFileDialog Settings" --key "Breadcrumb Navigation" false
              kwriteconfig6 --file kdeglobals --group "KFileDialog Settings" --key "Show Inline Previews" true
              kwriteconfig6 --file kdeglobals --group "KFileDialog Settings" --key "Speedbar Width" 138
              kwriteconfig6 --file kdeglobals --group "KFileDialog Settings" --key "Places Icons Static Size" 22
              kwriteconfig6 --file kdeglobals --group "PreviewSettings" --key "MaximumRemoteSize" 0
              kwriteconfig6 --file kdeglobals --group "PreviewSettings" --key "EnableRemoteFolderThumbnail" false

              # 6. KWin & Display (kwinrc)
              kwriteconfig6 --file kwinrc --group "Tiling" --key "padding" 4
              kwriteconfig6 --file kwinrc --group "Xwayland" --key "Scale" 1.15
              kwriteconfig6 --file kwinrc --group "Desktops" --key "Number" 1

              # 7. Dolphin Plasma 6 Configuration
              killall -9 dolphin 2>/dev/null

              cat << 'EOF' > /home/ratel/.local/share/dolphin/view_properties/global/.directory
              [Dolphin]
              ViewMode=1
              EOF

              cat << 'EOF' > /home/ratel/.local/state/dolphinstaterc
              [State]
              1280x800 screen: Window-Maximized=true
              
              EOF

              cat << 'EOF' > /home/ratel/.config/dolphinrc
              [General]
              RememberViewFeaturesPerFolder=false
              Version=200

              [KFileDialog Settings]
              Places Icons Static Size=22
              EOF

              chown -R ratel:ratel /home/ratel/.local/state/dolphinstaterc \
                                   /home/ratel/.local/share/dolphin/ \
                                   /home/ratel/.config/dolphinrc

              # 8. UI Feedback & Launch Animations
              kwriteconfig6 --file klaunchrc --group "FeedbackStyle" --key "BusyCursor" false
              kwriteconfig6 --file klaunchrc --group "FeedbackStyle" --key "CursorFeedbackRotation" false
              kwriteconfig6 --file klaunchrc --group "FeedbackStyle" --key "TaskbarButtonAnimation" false

              kwriteconfig6 --file klaunchrc --group "BusyCursorSettings" --key "Blinking" false
              kwriteconfig6 --file klaunchrc --group "BusyCursorSettings" --key "Bouncing" false
              kwriteconfig6 --file klaunchrc --group "BusyCursorSettings" --key "BusyCursor" false
              kwriteconfig6 --file klaunchrc --group "BusyCursorSettings" --key "Static" false
              kwriteconfig6 --file klaunchrc --group "BusyCursorSettings" --key "Timeout" 0

              # 9. Taskbar Icons & Kickoff Start Menu Favorites
              APPLETSRC="$HOME/.config/plasma-org.kde.plasma.desktop-appletsrc"

              # Configure Taskbar Pinned Icons (System Settings -> Brave -> Dolphin -> Konsole)
              kwriteconfig6 --file "$APPLETSRC" \
                            --group "Containments" --group "2" --group "Applets" --group "5" --group "Configuration" --group "General" \
                            --key "launchers" "applications:systemsettings.desktop,applications:com.brave.Browser.nightly.desktop,applications:org.kde.dolphin.desktop,applications:org.kde.konsole.desktop"

              # Configure Kickoff Start Menu Favorites (System Monitor -> System Settings -> Discover -> Dolphin -> Brave)
              kwriteconfig6 --file "$APPLETSRC" \
                            --group "Containments" --group "2" --group "Applets" --group "3" --group "Configuration" --group "General" \
                            --key "favorites" "applications:org.kde.plasma-systemmonitor.desktop,applications:systemsettings.desktop,applications:org.kde.discover.desktop,applications:org.kde.dolphin.desktop,applications:com.brave.Browser.nightly.desktop"

              # Disable KAstats porting flag so Kickoff reads directly from appletsrc
              kwriteconfig6 --file "$APPLETSRC" \
                            --group "Containments" --group "2" --group "Applets" --group "3" --group "Configuration" --group "General" \
                            --key "favoritesPortedToKAstats" "false"

              # Restrict system favorites to power actions
              kwriteconfig6 --file "$APPLETSRC" \
                            --group "Containments" --group "2" --group "Applets" --group "3" --group "Configuration" --group "General" \
                            --key "systemFavorites" "suspend,hibernate,reboot,shutdown"

              # Clean up orphan top-level Applets keys
              kwriteconfig6 --file "$APPLETSRC" --group "Applets" --group "3" --group "Configuration" --group "General" --key "favorites" --delete 2>/dev/null
              kwriteconfig6 --file "$APPLETSRC" --group "Applets" --group "5" --group "Configuration" --group "General" --key "launchers" --delete 2>/dev/null

              # 10. Keyboard & Konsole Defaults
              kwriteconfig6 --file kcminputrc --group "Keyboard" --key "NumLock" 1
              kwriteconfig6 --file konsolerc --group "Desktop Entry" --key "DefaultProfile" "Ratel.profile"

              # 11. Rebuild service index cache
              kbuildsycoca6 --noincremental 2>/dev/null

        - name: KDE Customization - Execute theme script offscreen as ratel user
          command: /home/ratel/.local/bin/apply-kde-theme.sh
          become: yes
          become_user: ratel
          environment:
            HOME: /home/ratel
            USER: ratel

        - name: KDE Customization - Deploy filtered Places sidebar
          copy:
            dest: /home/ratel/.local/share/user-places.xbel
            owner: ratel
            group: ratel
            mode: '0644'
            content: |
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE xbel>
              <xbel xmlns:bookmark="http://www.freedesktop.org/standards/desktop-bookmarks" xmlns:kdepriv="http://www.kde.org/kdepriv">
               <bookmark href="file:///home/ratel">
                <title>Home</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="user-home"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="file:///home/ratel/Desktop">
                <title>Desktop</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="user-desktop"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="trash:/">
                <title>Trash</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="user-trash"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="remote:/">
                <title>Network</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="folder-network"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="file:///home/ratel/Downloads">
                <title>Downloads</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="folder-download"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                  <IsHidden>true</IsHidden>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="timeline:/today">
                <title>Today</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="go-today"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                  <IsHidden>true</IsHidden>
                 </metadata>
                </info>
               </bookmark>
               <bookmark href="timeline:/history">
                <title>History</title>
                <info>
                 <metadata owner="http://freedesktop.org">
                  <bookmark:icon name="view-history"/>
                 </metadata>
                 <metadata owner="http://www.kde.org">
                  <IsSystemItem>true</IsSystemItem>
                  <IsHidden>true</IsHidden>
                 </metadata>
                </info>
               </bookmark>
              </xbel>

        # --- Boot & System Targets ---
        - name: Desktop Specific - Set default boot target to Graphical UI
          file:
            src: /lib/systemd/system/graphical.target
            dest: /etc/systemd/system/default.target
            state: link

        - name: GRUB - Set GRUB_TIMEOUT to 1 second
          lineinfile:
            path: /etc/default/grub
            regexp: '^GRUB_TIMEOUT='
            line: 'GRUB_TIMEOUT=1'
            backup: yes
          notify: Update GRUB

        - name: Identity - Create a customized motd
          copy:
            content: "Welcome to {{ ansible_hostname }}. Managed by Ansible Pull.\n"
            dest: /etc/motd

  handlers:
    - name: Update GRUB
      command: update-grub
